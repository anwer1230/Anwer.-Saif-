services:
  - type: web
    name: saraa-services
    env: python
    region: frankfurt
    plan: free
    branch: master
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SESSION_SECRET
        value: "anwer_speed_enjaz_secure_session_key_2026"
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: "anwer1230/Anwer.-Saif-"
      - key: GITHUB_BRANCH
        value: "master"
      - key: RENDER_DEPLOY_HOOK
        value: "https://api.render.com/deploy/srv-daps4mm7bikc738kaflg?key=BSGAfvSu9d4"
      - key: PORT
        value: "10000"
